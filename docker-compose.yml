services:
  db:
    image: mysql:8.0
    container_name: resume-db-2775
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: resume_db
    ports:
      - "3306:3306"
    volumes:
      - db_data_2775:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./resume/backend
      dockerfile: Dockerfile
    container_name: resume-backend-2775
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/resume_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8207:8080"

  frontend:
    build:
      context: ./resume/frontend
      dockerfile: Dockerfile
    container_name: resume-frontend-2775
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8080/api/v1
    ports:
      - "3207:80"

volumes:
  db_data_2775:
